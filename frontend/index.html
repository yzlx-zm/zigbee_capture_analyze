<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zigbee 拓扑分析</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;color:#1a1a1a;background:#f5f6fa;display:flex;flex-direction:column;height:100vh}
#nb{display:flex;align-items:center;background:#1e293b;color:#f1f5f9;padding:0 16px;height:44px;gap:16px;flex-shrink:0}
#nb .logo{font-weight:700;font-size:14px}
.nt{display:flex;gap:2px;flex:1}
.nt a{color:#94a3b8;text-decoration:none;padding:8px 14px;border-radius:6px 6px 0 0;font-size:12px;cursor:pointer}
.nt a:hover{color:#e2e8f0;background:#334155}
.nt a.on{color:#fff;background:#3b82f6}
#mc{flex:1;overflow:auto;padding:16px}
.card{background:#fff;border-radius:8px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:8px}
h3{font-size:13px;margin-bottom:8px}
.btn{padding:5px 12px;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:500}
.btn-p{background:#3b82f6;color:#fff}.btn-p:hover{background:#2563eb}
.btn-o{border:1px solid #d1d5db;background:#fff;color:#374151}
.btn-r{background:#ef4444;color:#fff}
input,select{padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:12px}
.file-drop{border:2px dashed #94a3b8;border-radius:8px;padding:30px;text-align:center;cursor:pointer;margin:8px 0}
.file-drop:hover{border-color:#3b82f6;background:#eff6ff}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:#f1f5f9;text-align:left;padding:4px 6px;color:#475569;border-bottom:2px solid #cbd5e1;position:sticky;top:0}
.tbl td{padding:3px 6px;border-bottom:1px solid #f1f5f9}
.tbl tr{cursor:pointer}.tbl tr:hover{background:#f0f9ff}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:#64748b}
.stats span{background:#f1f5f9;padding:2px 6px;border-radius:3px}
canvas{border:1px solid #e2e8f0;border-radius:4px;cursor:grab}
</style></head>
<body>
<nav id="nb"><span class="logo">📡 Zigbee 拓扑分析</span><div class="nt">
<a class="nt on" data-r="import">导入</a><a class="nt" data-r="topo">拓扑</a>
<a class="nt" data-r="nodes">节点</a><a class="nt" data-r="ai">AI</a></div>
<span id="sb" style="font-size:11px;color:#94a3b8;margin-left:auto">就绪</span></nav>
<div id="mc"></div>
<script>
var A={get:u=>fetch(u).then(r=>r.json()),post:(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json())};
var S={pkts:0,nodes:0,topo:null};
var R={};function reg(n,h){R[n]=h}
function rt(){var h=location.hash.slice(1)||'import';
document.querySelectorAll('.nt a').forEach(function(t){t.classList.toggle('on',t.dataset.r===h)});
document.getElementById('mc').innerHTML='';if(R[h])R[h]()}
window.addEventListener('hashchange',rt);
function sb(m){document.getElementById('sb').textContent=m||'就绪'}

// ===== IMPORT =====
reg('import',function(){
  var h='';
  h+='<div class="card"><h3>📂 导入 CSV</h3>'
    +'<p style="font-size:11px;color:#94a3b8;margin-bottom:8px">Ubiqua File → Export → CSV</p>'
    +'<div class="file-drop" id="drop"><p>拖拽 .csv 文件到此处</p><input type="file" id="finp" accept=".csv" style="display:none"></div>'
    +'<button class="btn btn-o" id="lpath" style="font-size:11px">或输入本地路径...</button>'
    +'<div id="prog" style="display:none;margin-top:8px"><div class="progress"><div id="bar" style="width:0%;height:4px;background:#e2e8f0;border-radius:2px"><div style="height:100%;background:#3b82f6;border-radius:2px"></div></div></div><p id="imsg" style="font-size:11px"></p></div></div>';
  h+='<div class="card" id="sout" style="display:none"><h3>📊 导入结果</h3><div id="sdiv"></div>'
    +'<button class="btn btn-p" id="gotopo" style="margin-top:8px">查看拓扑 →</button> '
    +'<button class="btn btn-r" id="clr" style="margin-top:8px">清除数据</button></div>';
  document.getElementById('mc').innerHTML=h;

  var drop=document.getElementById('drop'),inp=document.getElementById('finp');
  drop.addEventListener('click',function(){inp.click()});
  drop.addEventListener('dragover',function(e){e.preventDefault()});
  drop.addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer.files.length)doI(e.dataTransfer.files[0])});
  inp.addEventListener('change',function(){if(inp.files.length)doI(inp.files[0])});
  document.getElementById('lpath').addEventListener('click',function(){
    var p=prompt('CSV 文件路径:');if(!p)return;
    document.getElementById('prog').style.display='block';document.getElementById('imsg').textContent='导入中...';
    var fd=new FormData();fd.append('path',p);
    fetch('/api/import/local',{method:'POST',body:fd}).then(r=>r.json()).then(function(d){sr(d);document.getElementById('prog').style.display='none'})
      .catch(function(e){alert('错误: '+e.message);document.getElementById('prog').style.display='none'});
  });
  document.getElementById('gotopo').addEventListener('click',function(){location.hash='topo'});
  document.getElementById('clr').addEventListener('click',function(){
    if(!confirm('确认清除所有数据？'))return;
    fetch('/api/import/clear',{method:'DELETE'}).then(r=>r.json()).then(function(){
      S.topo=null;S.pkts=0;S.nodes=0;sb('就绪');document.getElementById('sout').style.display='none';
    });
  });
  // Check if already loaded
  A.get('/api/import/status').then(function(s){if(s.total){sr({packets:s.total,nodes:s.nodes,by_type:{}})}});
});

function doI(file){document.getElementById('prog').style.display='block';document.getElementById('imsg').textContent='上传解析中...';
  var fd=new FormData();fd.append('files',file);
  fetch('/api/import/files',{method:'POST',body:fd}).then(r=>r.json()).then(function(d){sr(d);document.getElementById('prog').style.display='none'})
    .catch(function(e){alert('错误: '+e.message);document.getElementById('prog').style.display='none'});}

function sr(d){document.getElementById('sout').style.display='block';
  document.getElementById('sdiv').innerHTML='<div class="stats"><span>总包:'+(d.packets||0)+'</span><span>节点:'+(d.nodes||0)+'</span></div><p style="font-size:11px;margin-top:4px">'+JSON.stringify(d.by_type||{}).substr(0,300)+'</p>';
  S.pkts=d.packets||0;S.nodes=d.nodes||0;sb(S.pkts+'包 | '+S.nodes+'节点');
  A.get('/api/topology/graph').then(function(td){S.topo=td});}

// ===== TOPOLOGY =====
reg('topo',function(){
  document.getElementById('mc').style.padding='0';
  var h='<div style="display:flex;height:calc(100vh - 44px)"><div style="width:340px;flex-shrink:0;overflow-y:auto;padding:12px;background:#fff;border-right:1px solid #e2e8f0">'
    +'<div class="card"><h3>📊 拓扑统计</h3><div id="tstat"></div></div>'
    +'<div class="card"><h3>🔗 链路评分 Top20</h3><div id="tlinks"></div></div></div>'
    +'<div style="flex:1;display:flex;flex-direction:column"><div id="topo-bar" style="display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid #e2e8f0">'
    +'<input id="tpan" placeholder="PAN (16B6)" style="width:120px;font-family:monospace;font-size:11px">'
    +'<input id="taddr" placeholder="地址 (0000)" style="width:120px;font-family:monospace;font-size:11px">'
    +'<button class="btn btn-p" id="tgo">筛选</button><button class="btn btn-o" id="trst">重置</button>'
    +'<span style="font-size:11px;color:#94a3b8">🖱缩放|拖拽</span><span id="tinfo" style="font-size:11px;color:#64748b"></span></div>'
    +'<canvas id="tcv" style="flex:1"></canvas></div></div>';
  document.getElementById('mc').innerHTML=h;

  var z=1,px=0,py=0,dr=false,lx=0,ly=0,hl=null,pf=null;
  function load(){A.get('/api/topology/graph').then(function(d){S.topo=d;draw();updSidebar()})}
  function updSidebar(){
    var d=S.topo;if(!d)return;
    var pCount=Object.keys(d.parents||{}).length;
    document.getElementById('tstat').innerHTML='<div class="stats"><span>总节点:'+d.total_nodes+'</span><span>树节点:'+d.tree_node_count+'</span><span>父子:'+pCount+'</span>'
      +'<span>叶子:'+d.leaf_count+'</span><span>边:'+d.total_edges+'</span></div>'
      +'<p style="font-size:11px;margin-top:4px">协调器: '+(d.coord!=null?'0x'+d.coord.toString(16).toUpperCase():'?')+' | 主PAN: '+(d.main_pan!=null?'0x'+d.main_pan.toString(16).toUpperCase():'?')+'</p>'
      +'<p style="font-size:11px">深度: '+JSON.stringify(d.tree_depths||{})+'</p>';
    var es=(d.edges||[]).sort(function(a,b){return b.count-a.count}).slice(0,20);
    var lh='<table class="tbl"><tr><th>链路</th><th>包数</th><th>成功率</th><th>LS</th></tr>';
    for(var i=0;i<es.length;i++){var e=es[i];
      lh+='<tr><td>0x'+e.src.toString(16).toUpperCase().padStart(4,'0')+'→0x'+e.dst.toString(16).toUpperCase().padStart(4,'0')+'</td>'
        +'<td>'+e.count+'</td><td style="color:'+(e.success_rate>0.8?'#16a34a':e.success_rate>0.5?'#d97706':'#dc2626')+'">'+(e.success_rate*100).toFixed(0)+'%</td><td>'+(e.is_link_status?'✅':'')+'</td></tr>';}
    document.getElementById('tlinks').innerHTML=lh+'</table>';}

  function draw(){
    var d=S.topo;if(!d)return;var ns=d.nodes||[],es=d.edges||[];
    var fns=ns;if(pf!==null)fns=ns.filter(function(n){return n.pan===pf});
    var cv=document.getElementById('tcv');cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;
    var ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
    document.getElementById('tinfo').textContent=fns.length+' 节点';
    if(fns.length===0){ctx.fillText('无匹配节点',20,30);return}

    // Find coord & build parent-child tree for layout
    var coordNode=null;for(var i=0;i<fns.length;i++){if(fns[i].aid===d.coord){coordNode=fns[i];break}}
    if(!coordNode)coordNode=fns[0];

    // Build layout tree: coord at top, children wrapped in rows of 12
    var placed={};
    function placeNode(n, x, y){
      n._x=x;n._y=y;placed[n.aid]=true;var kids=(n.children||[]);
      if(kids.length===0)return;
      // Wrap children in rows of 12
      var perRow=12,rowGap=80,colGap=150;
      var rows=Math.ceil(kids.length/perRow);
      var yOff=0;
      for(var r=0;r<rows;r++){
        var rowKids=kids.slice(r*perRow,(r+1)*perRow);
        var startX=x-(rowKids.length-1)*colGap/2;
        for(var i=0;i<rowKids.length;i++){
          var child=null;for(var j=0;j<fns.length;j++){if(fns[j].aid===rowKids[i]){child=fns[j];break}}
          if(child&&!placed[child.aid])placeNode(child,startX+i*colGap,y+90+yOff);
        }
        yOff+=rowGap;
      }
    }
    placeNode(coordNode, 0, 20);

    // Place unplaced nodes in a grid below
    var unplaced=[];for(var i=0;i<fns.length;i++){if(!placed[fns[i].aid])unplaced.push(fns[i])}
    var maxY=20;for(var i=0;i<fns.length;i++){if(fns[i]._y&&fns[i]._y>maxY)maxY=fns[i]._y}
    for(var i=0;i<unplaced.length;i++){unplaced[i]._x=(i%10-4.5)*150;unplaced[i]._y=maxY+110+Math.floor(i/10)*80}

    var nr=10;ctx.save();ctx.translate(W/2+px,30+py);ctx.scale(z,z);

    // Draw edges (parent→child, green+thick; other traffic, gray+thin)
    for(var i=0;i<es.length;i++){var e=es[i];var sn=null,dn=null;
      for(var j=0;j<fns.length;j++){if(fns[j].aid===e.src)sn=fns[j];if(fns[j].aid===e.dst)dn=fns[j]}
      if(!sn||!dn||sn._x===undefined||dn._x===undefined)continue;
      var isPC=e.is_parent_child;
      ctx.beginPath();ctx.moveTo(sn._x,sn._y+nr);ctx.lineTo(dn._x,dn._y-nr);
      if(isPC){ctx.strokeStyle='rgba(34,197,94,0.7)';ctx.lineWidth=2.5}
      else{ctx.strokeStyle='rgba(148,163,184,0.25)';ctx.lineWidth=1}
      ctx.stroke();
      if(isPC){ctx.fillStyle='#16a34a';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
        ctx.fillText(e.count,(sn._x+dn._x)/2,(sn._y+dn._y)/2)}
    }

    // Draw nodes
    for(var i=0;i<fns.length;i++){var n=fns[i];if(n._x===undefined)continue;
      var isH=hl!==null&&n.aid===hl;
      var isRouter=n.children&&n.children.length>0;
      var clr=n.is_coord?'#fbbf24':isRouter?'#3b82f6':n.seen>100?'#22c55e':n.seen>20?'#94a3b8':'#e2e8f0';
      if(isH)clr='#ef4444';
      ctx.beginPath();ctx.arc(n._x,n._y,isH?nr+4:isRouter?nr+2:nr,0,Math.PI*2);
      ctx.fillStyle=clr;ctx.fill();
      ctx.strokeStyle=isH?'#ef4444':isRouter?'#1e40af':'#fff';ctx.lineWidth=isH?3:isRouter?2:1.5;ctx.stroke();
      ctx.fillStyle='#1a1a1a';ctx.font='10px monospace';ctx.textAlign='center';
      var lb='0x'+n.aid.toString(16).toUpperCase().padStart(4,'0');
      if(n.children&&n.children.length>0)lb+=' ['+n.children.length+']';
      ctx.fillText(lb,n._x,n._y+nr+10);
      if(n.depth>=0){ctx.fillStyle='#94a3b8';ctx.font='8px sans-serif';ctx.fillText('L'+n.depth,n._x,n._y+nr+20)}
    }ctx.restore();}

  setTimeout(function(){var cv=document.getElementById('tcv');
    cv.addEventListener('wheel',function(e){e.preventDefault();z*=e.deltaY<0?1.1:0.9;z=Math.max(0.1,Math.min(5,z));draw()});
    cv.addEventListener('mousedown',function(e){dr=true;lx=e.clientX;ly=e.clientY;cv.style.cursor='grabbing'});
    cv.addEventListener('mousemove',function(e){if(dr){px+=(e.clientX-lx)/z;py+=(e.clientY-ly)/z;lx=e.clientX;ly=e.clientY;draw()}});
    cv.addEventListener('mouseup',function(){dr=false;cv.style.cursor='grab'});cv.addEventListener('mouseleave',function(){dr=false;cv.style.cursor='grab'});
  },500);
  document.getElementById('tgo').addEventListener('click',function(){var v=document.getElementById('tpan').value.trim();pf=v?parseInt(v,16):null;v=document.getElementById('taddr').value.trim();hl=v?parseInt(v):null;draw()});
  document.getElementById('trst').addEventListener('click',function(){document.getElementById('tpan').value='';document.getElementById('taddr').value='';pf=null;hl=null;draw()});
  load();
});

// ===== NODES =====
reg('nodes',function(){
  document.getElementById('mc').innerHTML='<div class="card"><h3>📋 节点列表</h3><div style="display:flex;gap:8px;margin-bottom:8px">'
    +'<input id="ns" placeholder="搜索地址 (如 0A11)" style="width:160px;font-family:monospace"><button class="btn btn-p" id="ngo">搜索</button></div>'
    +'<div style="max-height:calc(100vh - 200px);overflow:auto"><table class="tbl"><thead><tr><th>地址</th><th>出现次数</th><th>PAN</th><th>协调器</th><th>包类型</th></tr></thead><tbody id="ntb"></tbody></table></div></div>';
  function load(q){A.get('/api/nodes?search='+(q||'')).then(function(ns){
      var h='';for(var i=0;i<ns.length;i++){var n=ns[i];
        h+='<tr data-aid="'+n.aid+'" style="cursor:pointer"><td>'+n.label+'</td><td>'+n.seen+'</td><td>'+(n.pan!=null?'0x'+n.pan.toString(16).toUpperCase():'-')+'</td><td>'+(n.is_coord?'✅':'')+'</td><td>'+(n.type_list||[]).join(', ')+'</td></tr>';}
      document.getElementById('ntb').innerHTML=h;
      document.querySelectorAll('#ntb tr').forEach(function(tr){tr.addEventListener('click',function(){location.hash='topo';setTimeout(function(){document.getElementById('taddr').value=tr.dataset.aid?parseInt(tr.dataset.aid).toString(16).toUpperCase():'';document.getElementById('tgo').click()},100)})});
    });}
  document.getElementById('ngo').addEventListener('click',function(){load(document.getElementById('ns').value)});
  load();
});

// ===== AI =====
reg('ai',function(){document.getElementById('mc').innerHTML='<div class="card"><h3>🤖 AI 分析</h3><p style="font-size:11px;color:#94a3b8">后续版本实现</p></div>'});

// ===== INIT =====
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.nt a').forEach(function(t){t.addEventListener('click',function(e){e.preventDefault();location.hash=this.dataset.r})});
  rt();A.get('/api/import/status').then(function(s){if(s.total)sb(s.total+'包 | '+s.nodes+'节点')}).catch(function(){});
});
</script></body></html>

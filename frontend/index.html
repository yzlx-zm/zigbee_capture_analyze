<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zigbee 拓扑分析</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;color:#1a1a1a;background:#f5f6fa;display:flex;flex-direction:column;height:100vh}
#nb{display:flex;align-items:center;background:#1e293b;color:#f1f5f9;padding:0 16px;height:44px;gap:16px;flex-shrink:0}
#nb .logo{font-weight:700;font-size:14px}
.nt{display:flex;gap:2px;flex:1}
.nt a{color:#94a3b8;text-decoration:none;padding:8px 14px;border-radius:6px 6px 0 0;font-size:12px;cursor:pointer}
.nt a:hover{color:#e2e8f0;background:#334155}
.nt a.on{color:#fff;background:#3b82f6}
#mc{flex:1;overflow:auto;padding:16px}
.card{background:#fff;border-radius:8px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:8px}
h3{font-size:13px;margin-bottom:8px}
.btn{padding:5px 12px;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:500}
.btn-p{background:#3b82f6;color:#fff}.btn-p:hover{background:#2563eb}
.btn-o{border:1px solid #d1d5db;background:#fff;color:#374151}
.btn-r{background:#ef4444;color:#fff}
input,select{padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:12px}
.file-drop{border:2px dashed #94a3b8;border-radius:8px;padding:30px;text-align:center;cursor:pointer;margin:8px 0}
.file-drop:hover{border-color:#3b82f6;background:#eff6ff}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:#f1f5f9;text-align:left;padding:4px 6px;color:#475569;border-bottom:2px solid #cbd5e1;position:sticky;top:0}
.tbl td{padding:3px 6px;border-bottom:1px solid #f1f5f9}
.tbl tr{cursor:pointer}.tbl tr:hover{background:#f0f9ff}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:#64748b}
.stats span{background:#f1f5f9;padding:2px 6px;border-radius:3px}
canvas{border:1px solid #e2e8f0;border-radius:4px;cursor:grab}
.tree{margin:0;padding:0;list-style:none;font-size:12px;font-family:monospace}
.tree li{position:relative;padding:4px 0 4px 24px;border-left:1px solid #d1d5db}
.tree li:last-child{border-left:none}
.tree li::before{content:'';position:absolute;top:15px;left:0;width:18px;height:1px;background:#d1d5db}
.tree .node{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}
.tree .node:hover{background:#f0f9ff}
.tree .node.coord{background:#fef3c7;font-weight:bold}
.tree .node.router{background:#dbeafe}
.tree .node.leaf{background:#f0fdf4}
.tree .node.low{background:#f1f5f9;color:#94a3b8}
.tree .toggle{display:inline-block;width:16px;text-align:center;cursor:pointer;color:#64748b;font-weight:bold;margin-right:2px}
.tree .fold{color:#3b82f6;cursor:pointer;font-size:11px;margin-left:4px}
.tree .node.hl{background:#fee2e2!important;outline:2px solid #ef4444}
.tree .edge-label{font-size:10px;color:#94a3b8;margin-left:4px}
.tree ul{margin:0;padding:0;list-style:none}
.tree .collapsed>ul{display:none}
.tree .collapsed>.node>.toggle{color:#3b82f6}
</style></head>
<body>
<nav id="nb"><span class="logo">📡 Zigbee 拓扑分析</span><div class="nt">
<a class="nt on" data-r="import">导入</a><a class="nt" data-r="topo">拓扑</a>
<a class="nt" data-r="tl">时间线</a><a class="nt" data-r="nodes">节点</a>
<a class="nt" data-r="ai">AI</a></div>
<span id="sb" style="font-size:11px;color:#94a3b8;margin-left:auto">就绪</span></nav>
<div id="mc"></div>
<script>
var A={get:u=>fetch(u).then(r=>r.json()),post:(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json())};
var S={pkts:0,nodes:0,topo:null,topoPan:null,topoAddr:null};
var R={};function reg(n,h){R[n]=h}
function rt(){var h=location.hash.slice(1)||'import';
document.querySelectorAll('.nt a').forEach(function(t){t.classList.toggle('on',t.dataset.r===h)});
document.getElementById('mc').innerHTML='';if(R[h])R[h]()}
window.addEventListener('hashchange',rt);
function sb(m){document.getElementById('sb').textContent=m||'就绪'}

// ===== IMPORT =====
reg('import',function(){
  if(!S.impTab)S.impTab='csv';
  var h='<div class="card"><h3>📂 数据导入</h3>'
    +'<div style="display:flex;gap:2px;margin-bottom:12px;border-bottom:2px solid #e2e8f0">'
    +'<button class="btn imp-tab'+(S.impTab==='csv'?' on':'')+'" data-tab="csv" style="border-radius:4px 4px 0 0;font-size:12px;padding:6px 14px;border:none;background:'+(S.impTab==='csv'?'#3b82f6;color:#fff':'#f1f5f9')+'">📊 CSV 快速预览</button>'
    +'<button class="btn imp-tab'+(S.impTab==='pcap'?' on':'')+'" data-tab="pcap" style="border-radius:4px 4px 0 0;font-size:12px;padding:6px 14px;border:none;background:'+(S.impTab==='pcap'?'#3b82f6;color:#fff':'#f1f5f9')+'">📡 pcap 深度分析</button>'
    +'</div>'
    +'<div id="imp-csv" style="display:'+(S.impTab==='csv'?'block':'none')+'">'
      +'<p style="font-size:11px;color:#94a3b8;margin-bottom:8px">Ubiqua File → Export → CSV</p>'
      +'<div class="file-drop" id="drop"><p>拖拽 .csv 文件到此处</p><input type="file" id="finp" accept=".csv" style="display:none"></div>'
      +'<button class="btn btn-o" id="lpath" style="font-size:11px">或输入本地路径...</button>'
    +'</div>'
    +'<div id="imp-pcap" style="display:'+(S.impTab==='pcap'?'block':'none')+'">'
      +'<p style="font-size:11px;color:#94a3b8;margin-bottom:8px">Ubiqua File → Export → pcap</p>'
      +'<div class="file-drop" id="pdrop"><p>拖拽 .pcap 文件到此处 (支持多选)</p><input type="file" id="pfinp" accept=".pcap,.pcapng" multiple style="display:none"></div>'
      +'<button class="btn btn-o" id="plpath" style="font-size:11px">或输入本地路径 (逗号分隔多个)...</button>'
      +'<div id="pkey-panel" class="card" style="display:none;margin-top:8px;background:#f8fafc">'
        +'<h4 style="font-size:12px;cursor:pointer" id="pkey-toggle">🔑 密钥管理 ▾</h4>'
        +'<div id="pkey-body" style="font-size:11px"></div>'
      +'</div>'
    +'</div>'
    +'<div id="prog" style="display:none;margin-top:8px"><p id="imsg" style="font-size:11px"></p></div></div>';
  h+='<div class="card" id="sout" style="display:none"><h3>📊 导入结果</h3><div id="sdiv"></div>'
    +'<button class="btn btn-p" id="gotopo" style="margin-top:8px">查看拓扑 →</button> '
    +'<button class="btn btn-r" id="clr" style="margin-top:8px">清除数据</button></div>';
  document.getElementById('mc').innerHTML=h;

  // Tab switch
  document.querySelectorAll('.imp-tab').forEach(function(btn){
    btn.addEventListener('click',function(){
      S.impTab=this.dataset.tab;
      document.getElementById('imp-csv').style.display=S.impTab==='csv'?'block':'none';
      document.getElementById('imp-pcap').style.display=S.impTab==='pcap'?'block':'none';
      document.querySelectorAll('.imp-tab').forEach(function(b){
        b.style.background=S.impTab===b.dataset.tab?'#3b82f6':'#f1f5f9';
        b.style.color=S.impTab===b.dataset.tab?'#fff':'#374151';
      });
      if(S.impTab==='pcap')loadKeyPanel();
    });
  });

  // ── CSV tab ──
  var drop=document.getElementById('drop'),inp=document.getElementById('finp');
  drop.addEventListener('click',function(){inp.click()});
  drop.addEventListener('dragover',function(e){e.preventDefault()});
  drop.addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer.files.length)doI(e.dataTransfer.files[0])});
  inp.addEventListener('change',function(){if(inp.files.length)doI(inp.files[0])});
  document.getElementById('lpath').addEventListener('click',function(){
    var p=prompt('CSV 文件路径:');if(!p)return;
    setProg('导入 CSV...');
    var fd=new FormData();fd.append('path',p);
    fetch('/api/import/local',{method:'POST',body:fd}).then(r=>r.json()).then(function(d){setProg('');sr(d)})
      .catch(function(e){alert('错误: '+e.message);setProg('')});
  });

  // ── pcap tab ──
  var pdrop=document.getElementById('pdrop'),pinp=document.getElementById('pfinp');
  pdrop.addEventListener('click',function(){pinp.click()});
  pdrop.addEventListener('dragover',function(e){e.preventDefault()});
  pdrop.addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer.files.length)doPI(e.dataTransfer.files)});
  pinp.addEventListener('change',function(){if(pinp.files.length)doPI(pinp.files)});
  document.getElementById('plpath').addEventListener('click',function(){
    var p=prompt('pcap 文件路径 (逗号分隔多个):');if(!p)return;
    setProg('导入 pcap (tshark 解析中, 可能需要 5-10 秒)...');
    var fd=new FormData();fd.append('paths',p);
    fetch('/api/import/local-pcap',{method:'POST',body:fd}).then(r=>r.json()).then(function(d){setProg('');sr(d)})
      .catch(function(e){alert('错误: '+e.message);setProg('')});
  });

  // Key panel toggle
  document.getElementById('pkey-toggle').addEventListener('click',function(){
    var body=document.getElementById('pkey-body');
    body.style.display=body.style.display==='none'?'block':'none';
    this.textContent=body.style.display==='none'?'🔑 密钥管理 ▸':'🔑 密钥管理 ▾';
    if(body.style.display!=='none')loadKeyPanel();
  });

  function loadKeyPanel(){
    A.get('/api/keys').then(function(d){
      var keys=d.keys||[],stats=d.stats;
      var h='';
      if(stats){h+='<div style="margin-bottom:8px;color:#64748b">📊 解密: '+stats.decrypted+'/'+stats.total_data_frames+' 帧 ('+(stats.decrypt_rate*100).toFixed(0)+'%)</div>';}
      h+='<table class="tbl"><tr><th>Key</th><th>标签</th><th>状态</th><th></th></tr>';
      for(var i=0;i<keys.length;i++){
        var k=keys[i];
        var matched=stats&&stats.matched_keys&&stats.matched_keys.some(function(m){return m.label===k.label});
        var status=matched?'<span style="color:#16a34a">✓ 命中</span>':'<span style="color:#94a3b8">✗ 未命中</span>';
        var del=k.is_preset?'':'<button class="btn btn-o" data-kl="'+k.label+'" style="font-size:9px;color:#ef4444">✕</button>';
        h+='<tr><td style="font-family:monospace;font-size:10px">'+k.hex.substring(0,16)+'...</td><td>'+k.label+(k.is_preset?' (预设)':'')+'</td><td>'+status+'</td><td>'+del+'</td></tr>';
      }
      h+='</table>';
      h+='<div style="margin-top:8px;display:flex;gap:4px"><input id="pk-hex" placeholder="粘贴 hex Key (FC:90:D2:...)" style="flex:1;font-size:10px;font-family:monospace"><input id="pk-label" placeholder="标签" style="width:80px;font-size:10px"><button class="btn btn-p" id="pk-add" style="font-size:10px">添加</button></div>';
      document.getElementById('pkey-body').innerHTML=h;

      // Add key handler
      document.getElementById('pk-add').addEventListener('click',function(){
        var hex=document.getElementById('pk-hex').value.trim();
        var label=document.getElementById('pk-label').value.trim()||('Key'+Date.now());
        if(!hex)return;
        A.post('/api/keys',{key:hex,label:label}).then(function(r){
          if(r.ok){loadKeyPanel();}else{alert(r.error||'添加失败');}
        });
      });

      // Delete key handlers
      document.querySelectorAll('[data-kl]').forEach(function(btn){
        btn.addEventListener('click',function(){
          var kl=this.dataset.kl;
          fetch('/api/keys/'+kl,{method:'DELETE'}).then(function(){loadKeyPanel();});
        });
      });
    });
  }
  window._loadKeyPanel=loadKeyPanel;

  // ── Common ──
  function setProg(msg){document.getElementById('prog').style.display=msg?'block':'none';document.getElementById('imsg').textContent=msg||'';}

  document.getElementById('gotopo').addEventListener('click',function(){location.hash='topo'});
  document.getElementById('clr').addEventListener('click',function(){
    if(!confirm('确认清除所有数据？'))return;
    fetch('/api/import/clear',{method:'DELETE'}).then(r=>r.json()).then(function(){
      S.topo=null;S.pkts=0;S.nodes=0;sb('就绪');document.getElementById('sout').style.display='none';
    });
  });
  // Check if already loaded
  A.get('/api/import/status').then(function(s){if(s.total){sr({packets:s.total,nodes:s.nodes,by_type:{}})}});
  // If on pcap tab, load key panel
  if(S.impTab==='pcap'){setTimeout(function(){loadKeyPanel();},200);}
});

function doI(file){setProg('上传解析中...');
  var fd=new FormData();fd.append('files',file);
  fetch('/api/import/files',{method:'POST',body:fd}).then(r=>r.json()).then(function(d){setProg('');sr(d)})
    .catch(function(e){alert('错误: '+e.message);setProg('')});}

function doPI(files){setProg('上传解析中 (tshark 可能需要 5-10 秒)...');
  var fd=new FormData();
  for(var i=0;i<files.length;i++)fd.append('files',files[i]);
  fetch('/api/import/pcap',{method:'POST',body:fd}).then(r=>r.json()).then(function(d){setProg('');sr(d);if(window._loadKeyPanel)window._loadKeyPanel();})
    .catch(function(e){alert('错误: '+e.message);setProg('')});}

function setProg(msg){var el=document.getElementById('prog');if(el){el.style.display=msg?'block':'none';}var im=document.getElementById('imsg');if(im)im.textContent=msg||'';}

function sr(d){document.getElementById('sout').style.display='block';
  var h='<div class="stats"><span>总包:'+(d.packets||0)+'</span><span>节点:'+(d.nodes||0)+'</span>';
  if(d.file_type)h+='<span>类型:'+d.file_type+'</span>';
  h+='</div><p style="font-size:11px;margin-top:4px">'+JSON.stringify(d.by_type||{}).substr(0,300)+'</p>';
  if(d.decrypt_stats){h+='<p style="font-size:11px;margin-top:2px;color:#16a34a">解密: '+d.decrypt_stats.decrypted+'/'+d.decrypt_stats.total_data_frames+' 帧 ('+(d.decrypt_stats.decrypt_rate*100).toFixed(0)+'%) | Clusters: '+JSON.stringify(d.decrypt_stats.by_cluster)+'</p>';}
  document.getElementById('sdiv').innerHTML=h;
  S.pkts=d.packets||0;S.nodes=d.nodes||0;sb(S.pkts+'包 | '+S.nodes+'节点');
  A.get('/api/topology/graph').then(function(td){S.topo=td});}

// ===== TOPOLOGY =====
reg('topo',function(){
  document.getElementById('mc').style.padding='0';
  var h='<div style="display:flex;height:calc(100vh - 44px)"><div style="width:360px;flex-shrink:0;overflow-y:auto;padding:12px;background:#fff;border-right:1px solid #e2e8f0">'
    +'<div class="card"><h3>📊 拓扑统计</h3><div id="tstat"></div></div>'
    +'<div class="card"><h3>🔗 链路评分</h3><div id="tlinks"></div></div><div class="card"><h3>📡 PAN 列表</h3><div id="pan-list"></div></div></div>'
    +'<div style="flex:1;overflow:auto;padding:12px"><div style="display:flex;gap:8px;margin-bottom:8px">'
    +'<input id="tpan" placeholder="PAN (16B6)" style="width:110px;font-family:monospace;font-size:11px">'
    +'<input id="taddr" placeholder="地址 (0000)" style="width:110px;font-family:monospace;font-size:11px">'
    +'<button class="btn btn-p" id="tgo">筛选</button><button class="btn btn-o" id="trst">重置</button>'
    +'<button class="btn btn-o" id="texp">全部展开</button><button class="btn btn-o" id="tcol">全部折叠</button><span id="tinfo" style="font-size:11px;color:#64748b"></span></div>'
    +'<ul class="tree" id="tree-root"></ul></div></div>';
  document.getElementById('mc').innerHTML=h;

  function load(){A.get('/api/topology/graph').then(function(d){S.topo=d;renderTree(null,null)})}

  function renderTree(filterPan, highlightAddr){
    window.highlightAddr=highlightAddr;
    var d=S.topo;if(!d)return;
    var ns=d.nodes||[],es=d.edges||[];
    // Apply PAN filter
    var filtered=ns;
    if(filterPan!==null&&filterPan!==undefined){
      filtered=ns.filter(function(n){return n.pan===filterPan||n.aid===0});
    }
    var treeCoord=d.coord;
    // Build filtered node lookup
    var filteredIds={};for(var i=0;i<filtered.length;i++)filteredIds[filtered[i].aid]=true;
    // Count filtered
    var displayPan=filterPan!==null&&filterPan!==undefined?filterPan.toString(16).toUpperCase():null;
    document.getElementById('tinfo').textContent=filtered.length+' 节点显示';
    if(displayPan)document.getElementById('tinfo').textContent+=' | PAN:0x'+displayPan;

    // Stats sidebar (use filtered data)
    var pCount=Object.keys(d.parents||{}).length;
    document.getElementById('tstat').innerHTML='<div style="font-size:16px;font-weight:700;color:#1e293b;margin-bottom:6px">'
      +(displayPan?'PAN:0x'+displayPan+' | ':'')+'显示 '+filtered.length+' / '+d.total_nodes+' 节点 | <span style="color:#3b82f6">主PAN:0x'+(d.main_pan!=null?d.main_pan.toString(16).toUpperCase():'?')+'</span></div>'
      +'<div class="stats"><span>协调器: '+(treeCoord!=null?'0x'+treeCoord.toString(16).toUpperCase():'?')+'</span><span>父子:'+pCount+'</span><span>叶子:'+d.leaf_count+'</span>'
      +'<span>边:'+d.total_edges+'</span></div>'
      +'<p style="font-size:11px;margin-top:4px">深度: '+JSON.stringify(d.tree_depths||{})+'</p>';
    // Filter edges: only those where both endpoints are in filtered set
    var filteredEdgeSet={};for(var i=0;i<filtered.length;i++)filteredEdgeSet[filtered[i].aid]=true;
    var fes=(d.edges||[]).filter(function(e){return filteredEdgeSet[e.src]&&filteredEdgeSet[e.dst];});
    fes.sort(function(a,b){return b.count-a.count});
    var ess=fes.slice(0,15);
    var lh='<table class="tbl"><tr><th>链路</th><th>包数</th><th>成功率</th></tr>';
    for(var i=0;i<ess.length;i++){var e=ess[i];
      lh+='<tr><td>0x'+e.src.toString(16).toUpperCase().padStart(4,'0')+'→0x'+e.dst.toString(16).toUpperCase().padStart(4,'0')+'</td>'
        +'<td>'+e.count+'</td><td style="color:'+(e.success_rate>0.8?'#16a34a':e.success_rate>0.5?'#d97706':'#dc2626')+'">'+(e.success_rate*100).toFixed(0)+'%</td></tr>';}
    document.getElementById('tlinks').innerHTML=lh+'</table>';
    // PAN list
    var pl=d.pan_list||[];
    var ph='<table class="tbl"><tr><th>PAN</th><th>包数</th></tr>';
    for(var i=0;i<pl.length;i++){ph+='<tr class="pan-row" data-pan="'+pl[i].pan+'" style="cursor:pointer"><td>'+pl[i].label+'</td><td>'+pl[i].count+'</td><td><button class="btn btn-o btn-s pan-tl-btn" data-pan="'+pl[i].pan+'" style="font-size:10px">→时间线</button></td></tr>';}
    document.getElementById('pan-list').innerHTML=ph+'</table>';
    document.querySelectorAll('.pan-row').forEach(function(r){r.addEventListener('click',function(e){if(e.target.classList.contains('pan-tl-btn'))return;var panVal=parseInt(this.dataset.pan);var panStr=panVal.toString(16).toUpperCase();document.getElementById('tpan').value=panStr;S.topoPan=panStr;A.get('/api/topology/graph?pan='+panStr).then(function(d){S.topo=d;renderTree(null,null)})})});
  document.querySelectorAll('.pan-tl-btn').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();var panVal=parseInt(this.dataset.pan);S.topoPan=panVal.toString(16).toUpperCase();location.hash='tl'})});

    // Build node lookup from FILTERED nodes
    var nmap={};for(var i=0;i<filtered.length;i++){nmap[filtered[i].aid]=filtered[i]}

    // Build adjacency for edges
    var edgeMap={};for(var i=0;i<es.length;i++){edgeMap[es[i].src+'-'+es[i].dst]=es[i];edgeMap[es[i].dst+'-'+es[i].src]=es[i]}

    // Render HTML tree
    function renderNode(aid, ul){
      var n=nmap[aid];if(!n)return;
      var li=document.createElement('li');
      var isRouter=n.children&&n.children.length>0;
      var cls=n.is_coord?'coord':isRouter?'router':n.seen>100?'leaf':'low';
      if(highlightAddr!==null&&highlightAddr!==undefined&&n.aid===highlightAddr)cls+=' hl';
      var kids=n.children||[];
      // Sort kids by coord_traffic
      kids.sort(function(a,b){return (nmap[b]?nmap[b].coord_traffic||0:0)-(nmap[a]?nmap[a].coord_traffic||0:0)});

      if(kids.length>0){
        var tog=document.createElement('span');tog.className='toggle';tog.textContent='▼';
        tog.addEventListener('click',function(e){e.stopPropagation();var p=this.parentElement;p.classList.toggle('collapsed');this.textContent=p.classList.contains('collapsed')?'▶':'▼'});
        li.appendChild(tog);
      }
      var nd=document.createElement('span');nd.className='node '+cls;
      nd.innerHTML='0x'+n.aid.toString(16).toUpperCase().padStart(4,'0');
      if(isRouter)nd.innerHTML+=' ['+kids.length+']';
      nd.title='seen:'+n.seen+' depth:'+n.depth+' parent:'+(n.parent!=null?'0x'+n.parent.toString(16).toUpperCase():'-');
      nd.addEventListener('click',function(){location.hash='nodes';setTimeout(function(){document.getElementById('ns').value='0x'+aid.toString(16).toUpperCase().padStart(4,'0');document.getElementById('ngo').click()},100)});
      li.appendChild(nd);

      // Edge info (parent→this)
      if(n.parent!=null){
        var ek=n.parent+'-'+aid;var edge=edgeMap[ek];
        if(edge){
          var el=document.createElement('span');el.className='edge-label';
          el.textContent='← '+edge.count+'pkts '+(edge.success_rate*100).toFixed(0)+'%';
          if(edge.is_link_status)el.textContent+=' LS';
          li.appendChild(el);
        }
      }

      // Children
      if(kids.length>0){
        var childUl=document.createElement('ul');
        var MAX=15;
        var show=kids.slice(0,MAX);
        for(var i=0;i<show.length;i++)renderNode(show[i], childUl);
        if(kids.length>MAX){
          var foldLi=document.createElement('li');
          var foldSpan=document.createElement('span');foldSpan.className='fold';
          foldSpan.textContent='...'+(kids.length-MAX)+' more (click to expand)';
          foldSpan.addEventListener('click',function(e){
            e.stopPropagation();
            var pli=this.parentElement;
            pli.style.display='none';
            var rest=kids.slice(MAX);
            for(var i=0;i<rest.length;i++)renderNode(rest[i], childUl);
          });
          foldLi.appendChild(foldSpan);
          childUl.appendChild(foldLi);
        }
        li.appendChild(childUl);
      }
      ul.appendChild(li);
    }

    var root=document.getElementById('tree-root');root.innerHTML='';
    var treeCoord=d.coord;
    if(treeCoord!=null&&nmap[treeCoord])renderNode(treeCoord, root);
    // Also render orphan nodes
    var orphans=[];for(var i=0;i<filtered.length;i++){if(filtered[i].parent==null&&filtered[i].aid!==treeCoord)orphans.push(filtered[i])}
    if(orphans.length>0){
      var oli=document.createElement('li');oli.classList.add('collapsed');var otog=document.createElement('span');otog.className='toggle';otog.textContent='▶';otog.addEventListener('click',function(e){e.stopPropagation();var p=this.parentElement;p.classList.toggle('collapsed');this.textContent=p.classList.contains('collapsed')?'▶':'▼'});oli.appendChild(otog);var ospan=document.createElement('span');ospan.className='node low';ospan.style.fontWeight='bold';ospan.style.background='#fef2f2';ospan.textContent='❓ 未归类节点 ('+orphans.length+')';oli.appendChild(ospan);
      var oul=document.createElement('ul');
      for(var i=0;i<Math.min(orphans.length,20);i++)renderNode(orphans[i].aid, oul);
      if(orphans.length>20){var fli=document.createElement('li');fli.innerHTML='<span class="fold">...'+(orphans.length-20)+' more</span>';oul.appendChild(fli)}
      oli.appendChild(oul);root.appendChild(oli);
    }
  }

  document.getElementById('tgo').addEventListener('click',function(){
    var panVal=document.getElementById('tpan').value.trim();
    var addrVal=document.getElementById('taddr').value.trim();
    S.topoPan=panVal||null;S.topoAddr=addrVal||null;
    A.get('/api/topology/graph?pan='+(panVal||'')).then(function(d){S.topo=d;renderTree(null,null)});
  });
  document.getElementById('trst').addEventListener('click',function(){document.getElementById('tpan').value='';document.getElementById('taddr').value='';S.topoPan=null;S.topoAddr=null;
    A.get('/api/topology/graph?pan=').then(function(d){S.topo=d;renderTree(null,null)});
  });
  document.getElementById('texp').addEventListener('click',function(){
    document.querySelectorAll('#tree-root .collapsed').forEach(function(el){el.classList.remove('collapsed');var t=el.querySelector('.toggle');if(t)t.textContent='▼'})});
  document.getElementById('tcol').addEventListener('click',function(){
    document.querySelectorAll('#tree-root li').forEach(function(el){if(el.querySelector('ul')){el.classList.add('collapsed');var t=el.querySelector('.toggle');if(t)t.textContent='▶'}})});
  // Load data then restore filter state (PAN-scoped API call)
  var apiPan=S.topoPan||'';
  A.get('/api/topology/graph?pan='+apiPan).then(function(d){S.topo=d;
  if(S.topoPan)document.getElementById('tpan').value=S.topoPan;
  if(S.topoAddr)document.getElementById('taddr').value=S.topoAddr;
  renderTree(null,null);
  });
});

// ===== TIMELINE =====
reg('tl',function(){
  // Init state: remember last filter
  if(!S.tlPan) S.tlPan='';
  if(!S.tlNode) S.tlNode='';
  if(!S.tlTs0H) S.tlTs0H=''; if(!S.tlTs0M) S.tlTs0M=''; if(!S.tlTs0S) S.tlTs0S='';
  if(!S.tlTs1H) S.tlTs1H=''; if(!S.tlTs1M) S.tlTs1M=''; if(!S.tlTs1S) S.tlTs1S='';
  if(!S.tlHasSearched) S.tlHasSearched=false;
  // Override PAN if jumped from topology
  if(S.topoPan){S.tlPan=S.topoPan; S.tlHasSearched=true;}

  document.getElementById('mc').style.padding='16px';
  // Build H/M/S dropdown helpers
  function hmssel(id,val,opts){var h='<select id="'+id+'" style="font-size:10px;font-family:monospace;width:48px">';for(var i=0;i<opts.length;i++){h+='<option value="'+opts[i]+'"'+(String(opts[i])===String(val)?' selected':'')+'>'+String(opts[i]).padStart(2,'0')+'</option>';}h+='</select>';return h;}
  var hourOpts=[];for(var hi=0;hi<24;hi++)hourOpts.push(hi);
  var minSecOpts=[];for(var mi=0;mi<60;mi++)minSecOpts.push(mi);

  document.getElementById('mc').innerHTML='<div class="card"><h3>📊 时间线</h3>'
    // Row 1: PAN + Node text inputs
    +'<div style="display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;align-items:center">'
    +'<span style="font-size:11px;font-weight:600">PAN:</span><input id="tl-pan" placeholder="FEED" style="width:90px;font-family:monospace;font-size:11px" value="'+S.tlPan+'">'
    +'<span style="font-size:11px;font-weight:600">节点:</span><input id="tl-node" placeholder="0x0000 或 0000" style="width:130px;font-family:monospace;font-size:11px" value="'+S.tlNode+'">'
    +'</div>'
    // Row 2: Time dropdowns (start ~ end)
    +'<div style="display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap;align-items:center">'
    +'<span style="font-size:11px;font-weight:600">时间:</span>'
    +hmssel('tl-h0',S.tlTs0H,hourOpts)+'<span style="font-size:10px">:</span>'+hmssel('tl-m0',S.tlTs0M,minSecOpts)+'<span style="font-size:10px">:</span>'+hmssel('tl-s0',S.tlTs0S,minSecOpts)
    +'<span style="font-size:10px;margin:0 4px">~</span>'
    +hmssel('tl-h1',S.tlTs1H,hourOpts)+'<span style="font-size:10px">:</span>'+hmssel('tl-m1',S.tlTs1M,minSecOpts)+'<span style="font-size:10px">:</span>'+hmssel('tl-s1',S.tlTs1S,minSecOpts)
    +'<button class="btn btn-o" id="tl-tclear" style="font-size:10px;margin-left:4px" title="清除时间过滤">✕</button>'
    +'</div>'
    // Row 3: View button + status
    +'<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">'
    +'<button class="btn btn-p" id="tshow" style="font-size:11px">🔍 查看</button>'
    +'<span id="tl-capture-info" style="font-size:10px;color:#94a3b8"></span>'
    +'<span id="tl-stat" style="font-size:11px;color:#64748b;margin-left:auto"></span></div>'
    // Summary
    +'<div id="tl-summary" style="display:none;margin-bottom:8px;padding:8px;background:#f8fafc;border-radius:4px;font-size:12px"></div>'
    // Packet table
    +'<div style="max-height:calc(100vh - 360px);overflow:auto"><table class="tbl" id="tltbl"><thead><tr>'
    +'<th>时间</th><th>类型</th><th>MAC Src</th><th>MAC Dst</th><th>NWK Src</th><th>NWK Dst</th><th>安全</th><th>状态</th>'
    +'</tr></thead><tbody id="tltb"><tr><td colspan="8" style="color:#94a3b8;text-align:center;padding:40px">请输入过滤条件后点击「查看」</td></tr></tbody></table></div>'
    // Pagination
    +'<div id="tl-pager" style="display:none;align-items:center;gap:8px;padding:8px;font-size:12px;border-top:1px solid #e2e8f0;margin-top:8px">'
    +'<button class="btn btn-o" id="tl-pp" style="font-size:10px">上一页</button><span id="tl-pi">-</span><button class="btn btn-o" id="tl-pn" style="font-size:10px">下一页</button>'
    +'<span>跳至</span><input id="tl-pj" style="width:45px;font-size:10px"><span>页</span><button class="btn btn-o" id="tl-pgo" style="font-size:10px">Go</button>'
    +'<span>每页</span><select id="tl-ps" style="font-size:10px"><option value="50">50</option><option value="100">100</option><option value="200" selected>200</option><option value="500">500</option></select></div></div>';

  var tlPage=1,tlLimit=200,tlTotal=0,tlCaptureStart=null,tlCaptureEnd=null;

  function tlFmtTs(ts){var d=new Date(ts*1000);return d.toISOString().substr(11,12);}

  function tlGetTimeFilter(){
    var h0=document.getElementById('tl-h0').value;
    var m0=document.getElementById('tl-m0').value;
    var s0=document.getElementById('tl-s0').value;
    var h1=document.getElementById('tl-h1').value;
    var m1=document.getElementById('tl-m1').value;
    var s1=document.getElementById('tl-s1').value;
    var ts0=String(h0).padStart(2,'0')+':'+String(m0).padStart(2,'0')+':'+String(s0).padStart(2,'0');
    var ts1=String(h1).padStart(2,'0')+':'+String(m1).padStart(2,'0')+':'+String(s1).padStart(2,'0');
    return {ts0:ts0, ts1:ts1};
  }

  function tlSaveFilter(){
    S.tlPan=document.getElementById('tl-pan').value.trim();
    S.tlNode=document.getElementById('tl-node').value.trim();
    S.tlTs0H=document.getElementById('tl-h0').value; S.tlTs0M=document.getElementById('tl-m0').value; S.tlTs0S=document.getElementById('tl-s0').value;
    S.tlTs1H=document.getElementById('tl-h1').value; S.tlTs1M=document.getElementById('tl-m1').value; S.tlTs1S=document.getElementById('tl-s1').value;
    S.tlHasSearched=true;
  }

  function updPgr(){
    var mp=Math.ceil(tlTotal/tlLimit)||1;
    document.getElementById('tl-pi').textContent='第 '+tlPage+' / '+mp+' 页 (共 '+tlTotal+' 条)';
    document.getElementById('tl-pp').disabled=tlPage<=1;
    document.getElementById('tl-pn').disabled=tlPage>=mp;
  }

  function search(){
    var panVal=document.getElementById('tl-pan').value.trim();
    var nodeVal=document.getElementById('tl-node').value.trim();
    // Normalize: strip 0x prefix
    if(panVal.match(/^0x/i))panVal=panVal.slice(2);
    if(nodeVal.match(/^0x/i))nodeVal=nodeVal.slice(2);
    var tf=tlGetTimeFilter();
    tlSaveFilter();
    // Build params
    var params='limit='+tlLimit+'&offset='+((tlPage-1)*tlLimit);
    if(panVal)params+='&pan='+panVal;
    if(nodeVal)params+='&addr='+nodeVal;
    if(tf.ts0)params+='&time_start='+encodeURIComponent(tf.ts0);
    if(tf.ts1)params+='&time_end='+encodeURIComponent(tf.ts1);
    // Show what we're querying
    document.getElementById('tl-stat').textContent='查询中... '+[panVal?'PAN='+panVal:'',nodeVal?'节点='+nodeVal:'',tf.ts0?'时间:'+tf.ts0+'~'+tf.ts1:''].filter(Boolean).join(' | ')||'全部包';
    // Summary params
    var sp=[];
    if(panVal)sp.push('pan='+panVal);
    if(nodeVal)sp.push('addr='+nodeVal);
    if(tf.ts0)sp.push('time_start='+encodeURIComponent(tf.ts0));
    if(tf.ts1)sp.push('time_end='+encodeURIComponent(tf.ts1));
    var sumUrl='/api/packets/summary'+(sp.length?'?'+sp.join('&'):'');
    // Fetch summary
    A.get(sumUrl).then(function(s){
      var el=document.getElementById('tl-summary');el.style.display='block';
      if(s.type==='device'){
        el.innerHTML='<b>设备 '+s.addr+'</b>: '+s.total_packets+' 包<br>'
          +Object.entries(s.type_counts||{}).map(function(e){return e[0]+'×'+e[1]}).join(' + ')+'<br>'
          +'⇄ 通信: '+(s.top_peers||[]).map(function(p){return p.addr+'('+p.count+')'}).join(', ');
      }else{
        el.innerHTML='<b>PAN '+s.pan+'</b>: '+s.total_packets+' 包 | '+s.active_devices+' 活跃设备<br>'
          +Object.entries(s.type_counts||{}).map(function(e){return e[0]+'×'+e[1]}).join(' + ');
      }
    }).catch(function(){});
    // Fetch packets
    A.get('/api/packets?'+params).then(function(d){
      var pkts=d.packets||[];tlTotal=d.total||pkts.length;
      var ctx=[panVal?'PAN='+panVal:'',nodeVal?'节点=0x'+nodeVal.toUpperCase():'',tf.ts0?'时间:'+tf.ts0+'~'+tf.ts1:''].filter(Boolean).join(' | ');
      document.getElementById('tl-stat').textContent='共 '+tlTotal+' 包'+(ctx?' ('+ctx+')':'');
      document.getElementById('tl-pager').style.display=tlTotal>0?'flex':'none';
      var h='';for(var i=0;i<pkts.length;i++){var p=pkts[i];
        var ts=tlFmtTs(p.ts);
        var ms=typeof p.mac_src==='number'?'0x'+p.mac_src.toString(16).toUpperCase():'-';
        var md=typeof p.mac_dst==='number'?'0x'+p.mac_dst.toString(16).toUpperCase():'-';
        var ns=typeof p.nwk_src==='number'?'0x'+p.nwk_src.toString(16).toUpperCase():'-';
        var nd=typeof p.nwk_dst==='number'?'0x'+p.nwk_dst.toString(16).toUpperCase():'-';
        h+='<tr><td>'+ts+'</td><td>'+p.pkt_type+'</td><td>'+ms+'</td><td>'+md+'</td><td>'+ns+'</td><td>'+nd+'</td><td>'+(p.security||'')+'</td><td>'+(p.status||'')+'</td></tr>';}
      document.getElementById('tltb').innerHTML=h||'<tr><td colspan="8" style="color:#94a3b8;text-align:center;padding:20px">无匹配数据'+(ctx?' — 条件: '+ctx:'')+'<br><span style="font-size:10px">提示: 尝试放宽过滤条件（清空节点或 PAN 再查）</span></td></tr>';
      updPgr();
    }).catch(function(e){document.getElementById('tl-stat').textContent='加载失败';});
  }

  // On Enter key in inputs, trigger search
  document.getElementById('tl-pan').addEventListener('keydown',function(e){if(e.key==='Enter'){tlPage=1;search()}});
  document.getElementById('tl-node').addEventListener('keydown',function(e){if(e.key==='Enter'){tlPage=1;search()}});

  // Clear time button — reset to capture start/end
  document.getElementById('tl-tclear').addEventListener('click',function(){
    if(tlCaptureStart&&tlCaptureEnd){
      var csd=new Date(tlCaptureStart*1000);var ced=new Date(tlCaptureEnd*1000);
      document.getElementById('tl-h0').value=csd.getUTCHours();document.getElementById('tl-m0').value=csd.getUTCMinutes();document.getElementById('tl-s0').value=csd.getUTCSeconds();
      document.getElementById('tl-h1').value=ced.getUTCHours();document.getElementById('tl-m1').value=ced.getUTCMinutes();document.getElementById('tl-s1').value=ced.getUTCSeconds();
    } else {
      document.getElementById('tl-h0').value='00';document.getElementById('tl-m0').value='00';document.getElementById('tl-s0').value='00';
      document.getElementById('tl-h1').value='00';document.getElementById('tl-m1').value='00';document.getElementById('tl-s1').value='00';
    }
  });

  // Search button
  document.getElementById('tshow').addEventListener('click',function(){tlPage=1;search()});
  // Pagination
  document.getElementById('tl-pp').addEventListener('click',function(){if(tlPage>1){tlPage--;search()}});
  document.getElementById('tl-pn').addEventListener('click',function(){tlPage++;search()});
  document.getElementById('tl-pgo').addEventListener('click',function(){var v=parseInt(document.getElementById('tl-pj').value);if(v>0){tlPage=v;search()}});
  document.getElementById('tl-ps').addEventListener('change',function(){tlLimit=parseInt(this.value);tlPage=1;search()});

  // Fetch capture time range for display + set default clock-time dropdowns
  A.get('/api/import/status').then(function(st){
    if(st.ts_start){tlCaptureStart=st.ts_start;tlCaptureEnd=st.ts_end;
      var capStartD=new Date(tlCaptureStart*1000);
      var capEndD=new Date(tlCaptureEnd*1000);
      var dur=tlCaptureEnd-tlCaptureStart;
      var durStr='';if(dur<60)durStr=dur.toFixed(0)+'秒';else if(dur<3600)durStr=(dur/60).toFixed(1)+'分钟';else durStr=(dur/3600).toFixed(1)+'小时';
      document.getElementById('tl-capture-info').textContent='抓包: '+tlFmtTs(tlCaptureStart)+' ~ '+tlFmtTs(tlCaptureEnd)+' ('+durStr+')';
      var capH=capStartD.getUTCHours();var capM=capStartD.getUTCMinutes();var capS=capStartD.getUTCSeconds();
      var endH=capEndD.getUTCHours();var endM=capEndD.getUTCMinutes();var endS=capEndD.getUTCSeconds();
      // Detect if saved time values are invalid (from old offset semantics):
      // if saved start clock is more than 1h before capture start or after capture end, reset
      var savedSec0=parseInt(S.tlTs0H||'0')*3600+parseInt(S.tlTs0M||'0')*60+parseInt(S.tlTs0S||'0');
      var capSec=capH*3600+capM*60+capS;
      var endSec=endH*3600+endM*60+endS;
      var needReset=!S.tlHasSearched||savedSec0<capSec-3600||savedSec0>endSec+3600;
      if(needReset){
        // Reset to capture range
        document.getElementById('tl-h0').value=capH;document.getElementById('tl-m0').value=capM;document.getElementById('tl-s0').value=capS;
        document.getElementById('tl-h1').value=endH;document.getElementById('tl-m1').value=endM;document.getElementById('tl-s1').value=endS;
        S.tlTs0H=String(capH);S.tlTs0M=String(capM);S.tlTs0S=String(capS);
        S.tlTs1H=String(endH);S.tlTs1M=String(endM);S.tlTs1S=String(endS);
      }
      // Auto-search after dropdowns are correct
      if(S.topoPan || S.tlHasSearched){
        tlPage=1; setTimeout(function(){search()},50);
      }
    }
  });
});

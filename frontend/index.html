<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zigbee 拓扑分析</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;color:#1a1a1a;background:#f5f6fa;display:flex;flex-direction:column;height:100vh}
#nb{display:flex;align-items:center;background:#1e293b;color:#f1f5f9;padding:0 16px;height:44px;gap:16px;flex-shrink:0}
#nb .logo{font-weight:700;font-size:14px}
.nt{display:flex;gap:2px;flex:1}
.nt a{color:#94a3b8;text-decoration:none;padding:8px 14px;border-radius:6px 6px 0 0;font-size:12px;cursor:pointer}
.nt a:hover{color:#e2e8f0;background:#334155}
.nt a.on{color:#fff;background:#3b82f6}
#mc{flex:1;overflow:auto;padding:16px}
.card{background:#fff;border-radius:8px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:8px}
h3{font-size:13px;margin-bottom:8px}
.btn{padding:5px 12px;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:500}
.btn-p{background:#3b82f6;color:#fff}.btn-p:hover{background:#2563eb}
.btn-o{border:1px solid #d1d5db;background:#fff;color:#374151}
.btn-r{background:#ef4444;color:#fff}
input,select{padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:12px}
.file-drop{border:2px dashed #94a3b8;border-radius:8px;padding:30px;text-align:center;cursor:pointer;margin:8px 0}
.file-drop:hover{border-color:#3b82f6;background:#eff6ff}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:#f1f5f9;text-align:left;padding:4px 6px;color:#475569;border-bottom:2px solid #cbd5e1;position:sticky;top:0}
.tbl td{padding:3px 6px;border-bottom:1px solid #f1f5f9}
.tbl tr{cursor:pointer}.tbl tr:hover{background:#f0f9ff}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:#64748b}
.stats span{background:#f1f5f9;padding:2px 6px;border-radius:3px}
canvas{border:1px solid #e2e8f0;border-radius:4px;cursor:grab}
.tree{margin:0;padding:0;list-style:none;font-size:12px;font-family:monospace}
.tree li{position:relative;padding:4px 0 4px 24px;border-left:1px solid #d1d5db}
.tree li:last-child{border-left:none}
.tree li::before{content:'';position:absolute;top:15px;left:0;width:18px;height:1px;background:#d1d5db}
.tree .node{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}
.tree .node:hover{background:#f0f9ff}
.tree .node.coord{background:#fef3c7;font-weight:bold}
.tree .node.router{background:#dbeafe}
.tree .node.leaf{background:#f0fdf4}
.tree .node.low{background:#f1f5f9;color:#94a3b8}
.tree .toggle{display:inline-block;width:16px;text-align:center;cursor:pointer;color:#64748b;font-weight:bold;margin-right:2px}
.tree .fold{color:#3b82f6;cursor:pointer;font-size:11px;margin-left:4px}
.tree .node.hl{background:#fee2e2!important;outline:2px solid #ef4444}
.tree .edge-label{font-size:10px;color:#94a3b8;margin-left:4px}
.tree ul{margin:0;padding:0;list-style:none}
.tree .collapsed>ul{display:none}
.tree .collapsed>.node>.toggle{color:#3b82f6}
</style></head>
<body>
<nav id="nb"><span class="logo">📡 Zigbee 拓扑分析</span><div class="nt">
<a class="nt on" data-r="import">导入</a><a class="nt" data-r="topo">拓扑</a>
<a class="nt" data-r="tl">时间线</a><a class="nt" data-r="nodes">节点</a>
<a class="nt" data-r="ai">AI</a></div>
<span id="sb" style="font-size:11px;color:#94a3b8;margin-left:auto">就绪</span></nav>
<div id="mc"></div>
<script>
var A={get:u=>fetch(u).then(r=>r.json()),post:(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json())};
var S={pkts:0,nodes:0,topo:null};
var R={};function reg(n,h){R[n]=h}
function rt(){var h=location.hash.slice(1)||'import';
document.querySelectorAll('.nt a').forEach(function(t){t.classList.toggle('on',t.dataset.r===h)});
document.getElementById('mc').innerHTML='';if(R[h])R[h]()}
window.addEventListener('hashchange',rt);
function sb(m){document.getElementById('sb').textContent=m||'就绪'}

// ===== IMPORT =====
reg('import',function(){
  var h='';
  h+='<div class="card"><h3>📂 导入 CSV</h3>'
    +'<p style="font-size:11px;color:#94a3b8;margin-bottom:8px">Ubiqua File → Export → CSV</p>'
    +'<div class="file-drop" id="drop"><p>拖拽 .csv 文件到此处</p><input type="file" id="finp" accept=".csv" style="display:none"></div>'
    +'<button class="btn btn-o" id="lpath" style="font-size:11px">或输入本地路径...</button>'
    +'<div id="prog" style="display:none;margin-top:8px"><div class="progress"><div id="bar" style="width:0%;height:4px;background:#e2e8f0;border-radius:2px"><div style="height:100%;background:#3b82f6;border-radius:2px"></div></div></div><p id="imsg" style="font-size:11px"></p></div></div>';
  h+='<div class="card" id="sout" style="display:none"><h3>📊 导入结果</h3><div id="sdiv"></div>'
    +'<button class="btn btn-p" id="gotopo" style="margin-top:8px">查看拓扑 →</button> '
    +'<button class="btn btn-r" id="clr" style="margin-top:8px">清除数据</button></div>';
  document.getElementById('mc').innerHTML=h;

  var drop=document.getElementById('drop'),inp=document.getElementById('finp');
  drop.addEventListener('click',function(){inp.click()});
  drop.addEventListener('dragover',function(e){e.preventDefault()});
  drop.addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer.files.length)doI(e.dataTransfer.files[0])});
  inp.addEventListener('change',function(){if(inp.files.length)doI(inp.files[0])});
  document.getElementById('lpath').addEventListener('click',function(){
    var p=prompt('CSV 文件路径:');if(!p)return;
    document.getElementById('prog').style.display='block';document.getElementById('imsg').textContent='导入中...';
    var fd=new FormData();fd.append('path',p);
    fetch('/api/import/local',{method:'POST',body:fd}).then(r=>r.json()).then(function(d){sr(d);document.getElementById('prog').style.display='none'})
      .catch(function(e){alert('错误: '+e.message);document.getElementById('prog').style.display='none'});
  });
  document.getElementById('gotopo').addEventListener('click',function(){location.hash='topo'});
  document.getElementById('clr').addEventListener('click',function(){
    if(!confirm('确认清除所有数据？'))return;
    fetch('/api/import/clear',{method:'DELETE'}).then(r=>r.json()).then(function(){
      S.topo=null;S.pkts=0;S.nodes=0;sb('就绪');document.getElementById('sout').style.display='none';
    });
  });
  // Check if already loaded
  A.get('/api/import/status').then(function(s){if(s.total){sr({packets:s.total,nodes:s.nodes,by_type:{}})}});
});

function doI(file){document.getElementById('prog').style.display='block';document.getElementById('imsg').textContent='上传解析中...';
  var fd=new FormData();fd.append('files',file);
  fetch('/api/import/files',{method:'POST',body:fd}).then(r=>r.json()).then(function(d){sr(d);document.getElementById('prog').style.display='none'})
    .catch(function(e){alert('错误: '+e.message);document.getElementById('prog').style.display='none'});}

function sr(d){document.getElementById('sout').style.display='block';
  document.getElementById('sdiv').innerHTML='<div class="stats"><span>总包:'+(d.packets||0)+'</span><span>节点:'+(d.nodes||0)+'</span></div><p style="font-size:11px;margin-top:4px">'+JSON.stringify(d.by_type||{}).substr(0,300)+'</p>';
  S.pkts=d.packets||0;S.nodes=d.nodes||0;sb(S.pkts+'包 | '+S.nodes+'节点');
  A.get('/api/topology/graph').then(function(td){S.topo=td});}

// ===== TOPOLOGY =====
reg('topo',function(){
  document.getElementById('mc').style.padding='0';
  var h='<div style="display:flex;height:calc(100vh - 44px)"><div style="width:360px;flex-shrink:0;overflow-y:auto;padding:12px;background:#fff;border-right:1px solid #e2e8f0">'
    +'<div class="card"><h3>📊 拓扑统计</h3><div id="tstat"></div></div>'
    +'<div class="card"><h3>🔗 链路评分</h3><div id="tlinks"></div></div><div class="card"><h3>📡 PAN 列表</h3><div id="pan-list"></div></div></div>'
    +'<div style="flex:1;overflow:auto;padding:12px"><div style="display:flex;gap:8px;margin-bottom:8px">'
    +'<input id="tpan" placeholder="PAN (16B6)" style="width:110px;font-family:monospace;font-size:11px">'
    +'<input id="taddr" placeholder="地址 (0000)" style="width:110px;font-family:monospace;font-size:11px">'
    +'<button class="btn btn-p" id="tgo">筛选</button><button class="btn btn-o" id="trst">重置</button>'
    +'<button class="btn btn-o" id="texp">全部展开</button><button class="btn btn-o" id="tcol">全部折叠</button><span id="tinfo" style="font-size:11px;color:#64748b"></span></div>'
    +'<ul class="tree" id="tree-root"></ul></div></div>';
  document.getElementById('mc').innerHTML=h;

  function load(){A.get('/api/topology/graph').then(function(d){S.topo=d;renderTree(null,null)})}

  function renderTree(filterPan, highlightAddr){
    var d=S.topo;if(!d)return;
    var ns=d.nodes||[],es=d.edges||[];
    // Apply PAN filter
    if(filterPan!==null&&filterPan!==undefined)ns=ns.filter(function(n){return n.pan===filterPan});
    // Count filtered
    document.getElementById('tinfo').textContent=ns.length+' 节点 | '+(d.tree_node_count)+' 树节点';
    if(filterPan!==null)document.getElementById('tinfo').textContent+=' | PAN:0x'+filterPan.toString(16).toUpperCase();

    // Stats sidebar
    var pCount=Object.keys(d.parents||{}).length;
    document.getElementById('tstat').innerHTML='<div class="stats"><span>总节点:'+d.total_nodes+'</span><span>树节点:'+d.tree_node_count+'</span><span>父子:'+pCount+'</span><span>叶子:'+d.leaf_count+'</span></div>'
      +'<p style="font-size:11px;margin-top:4px">协调器: '+(d.coord!=null?'0x'+d.coord.toString(16).toUpperCase():'?')+' | PAN: '+(d.main_pan!=null?'0x'+d.main_pan.toString(16).toUpperCase():'?')+'</p>'
      +'<p style="font-size:11px">深度: '+JSON.stringify(d.tree_depths||{})+'</p>';
    var ess=(d.edges||[]).sort(function(a,b){return b.count-a.count}).slice(0,15);
    var lh='<table class="tbl"><tr><th>链路</th><th>包数</th><th>成功率</th></tr>';
    for(var i=0;i<ess.length;i++){var e=ess[i];
      lh+='<tr><td>0x'+e.src.toString(16).toUpperCase().padStart(4,'0')+'→0x'+e.dst.toString(16).toUpperCase().padStart(4,'0')+'</td>'
        +'<td>'+e.count+'</td><td style="color:'+(e.success_rate>0.8?'#16a34a':e.success_rate>0.5?'#d97706':'#dc2626')+'">'+(e.success_rate*100).toFixed(0)+'%</td></tr>';}
    document.getElementById('tlinks').innerHTML=lh+'</table>';
    // PAN list
    var pl=d.pan_list||[];
    var ph='<table class="tbl"><tr><th>PAN</th><th>包数</th></tr>';
    for(var i=0;i<pl.length;i++){ph+='<tr class="pan-row" data-pan="'+pl[i].pan+'" style="cursor:pointer"><td>'+pl[i].label+'</td><td>'+pl[i].count+'</td></tr>';}
    document.getElementById('pan-list').innerHTML=ph+'</table>';
    document.querySelectorAll('.pan-row').forEach(function(r){r.addEventListener('click',function(){location.hash='tl';setTimeout(function(){document.getElementById('tnode').value='PAN:'+this.dataset.pan;document.getElementById('tshow').click()},200)})});

    // Build node lookup
    var nmap={};for(var i=0;i<ns.length;i++){nmap[ns[i].aid]=ns[i]}

    // Build adjacency for edges
    var edgeMap={};for(var i=0;i<es.length;i++){edgeMap[es[i].src+'-'+es[i].dst]=es[i];edgeMap[es[i].dst+'-'+es[i].src]=es[i]}

    // Render HTML tree
    function renderNode(aid, ul){
      var n=nmap[aid];if(!n)return;
      var li=document.createElement('li');
      var isRouter=n.children&&n.children.length>0;
      var cls=n.is_coord?'coord':isRouter?'router':n.seen>100?'leaf':'low';
      if(highlightAddr!==null&&highlightAddr!==undefined&&n.aid===highlightAddr)cls+=' hl';
      var kids=n.children||[];
      // Sort kids by coord_traffic
      kids.sort(function(a,b){return (nmap[b]?nmap[b].coord_traffic||0:0)-(nmap[a]?nmap[a].coord_traffic||0:0)});

      if(kids.length>0){
        var tog=document.createElement('span');tog.className='toggle';tog.textContent='▼';
        tog.addEventListener('click',function(e){e.stopPropagation();var p=this.parentElement;p.classList.toggle('collapsed');this.textContent=p.classList.contains('collapsed')?'▶':'▼'});
        li.appendChild(tog);
      }
      var nd=document.createElement('span');nd.className='node '+cls;
      nd.innerHTML='0x'+n.aid.toString(16).toUpperCase().padStart(4,'0');
      if(isRouter)nd.innerHTML+=' ['+kids.length+']';
      nd.title='seen:'+n.seen+' depth:'+n.depth+' parent:'+(n.parent!=null?'0x'+n.parent.toString(16).toUpperCase():'-');
      nd.addEventListener('click',function(){location.hash='nodes';setTimeout(function(){document.getElementById('ns').value='0x'+aid.toString(16).toUpperCase().padStart(4,'0');document.getElementById('ngo').click()},100)});
      li.appendChild(nd);

      // Edge info (parent→this)
      if(n.parent!=null){
        var ek=n.parent+'-'+aid;var edge=edgeMap[ek];
        if(edge){
          var el=document.createElement('span');el.className='edge-label';
          el.textContent='← '+edge.count+'pkts '+(edge.success_rate*100).toFixed(0)+'%';
          if(edge.is_link_status)el.textContent+=' LS';
          li.appendChild(el);
        }
      }

      // Children
      if(kids.length>0){
        var childUl=document.createElement('ul');
        var MAX=15;
        var show=kids.slice(0,MAX);
        for(var i=0;i<show.length;i++)renderNode(show[i], childUl);
        if(kids.length>MAX){
          var foldLi=document.createElement('li');
          var foldSpan=document.createElement('span');foldSpan.className='fold';
          foldSpan.textContent='...'+(kids.length-MAX)+' more (click to expand)';
          foldSpan.addEventListener('click',function(e){
            e.stopPropagation();
            var pli=this.parentElement;
            pli.style.display='none';
            var rest=kids.slice(MAX);
            for(var i=0;i<rest.length;i++)renderNode(rest[i], childUl);
          });
          foldLi.appendChild(foldSpan);
          childUl.appendChild(foldLi);
        }
        li.appendChild(childUl);
      }
      ul.appendChild(li);
    }

    var root=document.getElementById('tree-root');root.innerHTML='';
    if(d.coord!=null&&nmap[d.coord])renderNode(d.coord, root);
    // Also render orphan nodes
    var orphans=[];for(var i=0;i<ns.length;i++){if(ns[i].parent==null&&ns[i].aid!==d.coord)orphans.push(ns[i])}
    if(orphans.length>0){
      var oli=document.createElement('li');oli.classList.add('collapsed');var otog=document.createElement('span');otog.className='toggle';otog.textContent='▶';otog.addEventListener('click',function(e){e.stopPropagation();var p=this.parentElement;p.classList.toggle('collapsed');this.textContent=p.classList.contains('collapsed')?'▶':'▼'});oli.appendChild(otog);oli.innerHTML+='<span class="node low" style="font-weight:bold;background:#fef2f2">❓ 未归类节点 ('+orphans.length+')</span>';
      var oul=document.createElement('ul');
      for(var i=0;i<Math.min(orphans.length,20);i++)renderNode(orphans[i].aid, oul);
      if(orphans.length>20){var fli=document.createElement('li');fli.innerHTML='<span class="fold">...'+(orphans.length-20)+' more</span>';oul.appendChild(fli)}
      oli.appendChild(oul);root.appendChild(oli);
    }
  }

  document.getElementById('tgo').addEventListener('click',function(){
    var panVal=document.getElementById('tpan').value.trim();
    var addrVal=document.getElementById('taddr').value.trim();
    var pan=panVal?parseInt(panVal,16):null;
    var addr=addrVal?parseInt(addrVal):null;
    renderTree(pan,addr);
  });
  document.getElementById('trst').addEventListener('click',function(){document.getElementById('tpan').value='';document.getElementById('taddr').value='';renderTree(null,null)});
  document.getElementById('texp').addEventListener('click',function(){
    document.querySelectorAll('#tree-root .collapsed').forEach(function(el){el.classList.remove('collapsed');var t=el.querySelector('.toggle');if(t)t.textContent='▼'})});
  document.getElementById('tcol').addEventListener('click',function(){
    document.querySelectorAll('#tree-root li').forEach(function(el){if(el.querySelector('ul')){el.classList.add('collapsed');var t=el.querySelector('.toggle');if(t)t.textContent='▶'}})});
  load();
});

// ===== NODES =====
// ===== TIMELINE =====
reg('tl',function(){
  document.getElementById('mc').style.padding='16px';
  document.getElementById('mc').innerHTML='<div class="card"><h3>📊 时间线</h3>'
    +'<div style="display:flex;gap:8px;margin-bottom:8px"><input id="tnode" placeholder="地址或PAN (如 0x0000 或 FEED)" style="width:200px;font-family:monospace">'
    +'<button class="btn btn-p" id="tshow">查看</button><span id="tstat" style="font-size:11px;color:#64748b"></span></div>'
    +'<div style="max-height:calc(100vh - 200px);overflow:auto"><table class="tbl" id="tltbl"><thead><tr>'
    +'<th>时间</th><th>类型</th><th>MAC Src</th><th>MAC Dst</th><th>NWK Src</th><th>NWK Dst</th><th>状态</th>'
    +'</tr></thead><tbody id="tltb"></tbody></table></div></div>';
  function ld(filter){
    A.get('/api/import/status').then(function(st){
      if(!st.total){document.getElementById('tstat').textContent='请先导入数据';return}
      var q=filter||'';var params='limit=500&offset=0';
      if(q.match(/^[0-9A-Fa-f]+$/)){if(q.length<=4)params+='&pan='+q;else params+='&addr='+q}
      A.get('/api/packets?'+params).then(function(pkts){
        document.getElementById('tstat').textContent=pkts.length+' 包';
        var h='';for(var i=0;i<pkts.length;i++){var p=pkts[i];
          var ts=new Date(p.ts*1000).toISOString().substr(11,12);
          var ms=typeof p.mac_src==='number'?'0x'+p.mac_src.toString(16).toUpperCase():'-';
          var md=typeof p.mac_dst==='number'?'0x'+p.mac_dst.toString(16).toUpperCase():'-';
          var ns=typeof p.nwk_src==='number'?'0x'+p.nwk_src.toString(16).toUpperCase():'-';
          var nd=typeof p.nwk_dst==='number'?'0x'+p.nwk_dst.toString(16).toUpperCase():'-';
          h+='<tr><td>'+ts+'</td><td>'+p.pkt_type+'</td><td>'+ms+'</td><td>'+md+'</td><td>'+ns+'</td><td>'+nd+'</td><td>'+(p.status||'')+'</td></tr>';}
        document.getElementById('tltb').innerHTML=h||'<tr><td colspan=\"7\">无匹配</td></tr>';
      });
    });}
  document.getElementById('tshow').addEventListener('click',function(){ld(document.getElementById('tnode').value.trim())});
  ld();
});

// ===== NODES =====
reg('nodes',function(){
  document.getElementById('mc').innerHTML='<div class="card"><h3>📋 节点列表</h3><div style="display:flex;gap:8px;margin-bottom:8px">'
    +'<input id="ns" placeholder="搜索地址 (如 0A11)" style="width:160px;font-family:monospace"><button class="btn btn-p" id="ngo">搜索</button></div>'
    +'<div style="max-height:calc(100vh - 200px);overflow:auto"><table class="tbl"><thead><tr><th>地址</th><th>出现次数</th><th>PAN</th><th>协调器</th><th>包类型</th></tr></thead><tbody id="ntb"></tbody></table></div></div>';
  function load(q){A.get('/api/nodes?search='+(q||'')).then(function(ns){
      var h='';for(var i=0;i<ns.length;i++){var n=ns[i];
        h+='<tr data-aid="'+n.aid+'" style="cursor:pointer"><td>'+n.label+'</td><td>'+n.seen+'</td><td>'+(n.pan!=null?'0x'+n.pan.toString(16).toUpperCase():'-')+'</td><td>'+(n.is_coord?'✅':'')+'</td><td>'+(n.type_list||[]).join(', ')+'</td></tr>';}
      document.getElementById('ntb').innerHTML=h;
      document.querySelectorAll('#ntb tr').forEach(function(tr){tr.addEventListener('click',function(){location.hash='topo';setTimeout(function(){document.getElementById('taddr').value=tr.dataset.aid?parseInt(tr.dataset.aid).toString(16).toUpperCase():'';document.getElementById('tgo').click()},100)})});
    });}
  document.getElementById('ngo').addEventListener('click',function(){load(document.getElementById('ns').value)});
  load();
});

// ===== AI =====
reg('ai',function(){document.getElementById('mc').innerHTML='<div class="card"><h3>🤖 AI 分析</h3><p style="font-size:11px;color:#94a3b8">后续版本实现</p></div>'});

// ===== INIT =====
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.nt a').forEach(function(t){t.addEventListener('click',function(e){e.preventDefault();location.hash=this.dataset.r})});
  rt();A.get('/api/import/status').then(function(s){if(s.total)sb(s.total+'包 | '+s.nodes+'节点')}).catch(function(){});
});
</script></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zigbee 拓扑分析</title>
<link rel="stylesheet" href="css/app.css?v=20260827a"></head>
<body>
<script src="lib/cytoscape.min.js"></script>
<nav id="nb"><span class="logo">📡 Zigbee 拓扑分析</span><div class="nt">
<a class="nt on" data-r="import">导入</a><a class="nt" data-r="topo">拓扑</a>
<a class="nt" data-r="tl">报文</a><a class="nt" data-r="nodes">节点</a>
<a class="nt" data-r="diag">诊断</a></div>
<span id="sb">就绪</span><button class="btn btn-r btn-sm" id="sb-restart" title="导入卡死时重启后端">⟳ 重启后端</button></nav>
<div id="mc"></div>
<script>
// 路由引擎 (非模块 — inline 立即执行, 供后续 reg() 注册用)
var R={}; function reg(n,h){R[n]=h}
function rt(){var h=location.hash.slice(1)||'import';
  document.getElementById('mc').classList.toggle('mc-flat',h==='topo');
  document.querySelectorAll('.nt a').forEach(function(t){t.classList.toggle('on',t.dataset.r===h)});
  if((window.S||{}).verifyPassed===false||(window.S||{}).parserPassed===false){
    var why=(window.S||{}).parserPassed===false?'解析正确性校验未通过 (解析错位)':'数据校验未通过';
    document.querySelectorAll('.nt a[data-r="topo"],.nt a[data-r="tl"],.nt a[data-r="nodes"]').forEach(function(t){t.style.opacity='0.4';t.title=why});
    if(h==='topo'||h==='tl'||h==='nodes'){document.getElementById('mc').innerHTML='<div class="card card-danger"><h3 class="text-danger">🚫 '+why+'</h3><p class="text-danger">为保证数据准确，拓扑/报文/节点页已锁定。</p><p class="hint">请回到<a href="#import" class="text-info">导入页</a>检查校验报告并重新导入。</p></div>';return;}
  }else{
    document.querySelectorAll('.nt a').forEach(function(t){t.style.opacity='';t.title=''});
  }
  document.getElementById('mc').innerHTML='';if(R[h])R[h]();}
window.addEventListener('hashchange',rt);
</script>
<script type="module" src="js/app.js?v=20260828a"></script>
<script>
document.querySelectorAll('.nt a').forEach(function(t){t.addEventListener('click',function(e){e.preventDefault();location.hash=this.dataset.r})});
// 状态栏初始化移到 js/app.js (module 内执行, 避免 A 未定义的时序问题)
</script></body></html>
